name: Refresh ROG.e data and deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: roge-pages
  cancel-in-progress: true
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm test
      - name: Scrape official ROG.e sources
        run: npm run scrape
      - name: Sync event metadata without changing participants
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-team-events.mjs
      - name: Commit refreshed data when changed
        run: |
          git config user.name "roge-planner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/exhibitors.json
          git diff --cached --quiet || git commit -m "data: refresh official ROG.e schedule"
          # Team edits may advance main while the scraper is running.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
          done
      - name: Check whether GitHub Pages is enabled
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet (HTTP $code). Data refresh completed; deployment skipped."
          fi
      - name: Configure Pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Prepare public files only
        if: steps.pages_state.outputs.enabled == 'true'
        run: |
          mkdir -p _site/data
          cp index.html styles.css calendar.css maps.css _site/
          cp -r js assets _site/
          cp data/events.json data/exhibitors.json _site/data/
      - name: Upload Pages artifact
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: steps.pages_state.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
